; Prod needs QUEUE_CONNECTION=redis: MariaDB 10.3 there has no SKIP LOCKED, so two workers on the
; database queue deadlock on the jobs table
[program:water-ge-queue]
process_name=%(program_name)s_%(process_num)02d
command=/opt/php84/bin/php /var/www/water_andreev/data/www/water.andreev-e.ru/artisan queue:work --queue=default --timeout=60 --max-time=3600
autostart=true
autorestart=true
user=root
numprocs=2
stopwaitsecs=70
redirect_stderr=true
stdout_logfile=/var/www/water_andreev/data/www/water.andreev-e.ru/storage/logs/queue.log

