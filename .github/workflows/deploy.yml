name: Deploy

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: executing remote ssh commands as root
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.ROOT_PASSWORD }}
          port: 22
          script: |
            set -e
            cd ${{ vars.PROD_PATH }}

            chown -R ${{ secrets.USER_NAME }}:${{ secrets.USER_NAME }} .
            
            su - ${{ secrets.USER_NAME }} -c "
            cd '${{ vars.PROD_PATH }}' &&
            git config --global --add safe.directory '${{ vars.PROD_PATH }}' &&
            git checkout master &&
            git reset --hard &&
            git pull &&
            rm -f composer.lock
            "
            
            cp deploy/queue-worker.conf /etc/supervisor/conf.d/${{ secrets.USER_NAME }}.conf
            
            (service supervisor status >/dev/null 2>&1 || service supervisor start || supervisord -c /etc/supervisord.conf)
            
            sleep 2
            supervisorctl reread
            supervisorctl update
            service supervisor restart

      - name: executing remote ssh commands as deploy user
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER_NAME }}
          password: ${{ secrets.USER_PASSWORD }}
          port: 22
          script: |
            # ssh-action reports only the exit code of the last command, so stop at the first failure
            set -e
            cd ${{ vars.PROD_PATH }}

            # always restart workers so they drop the old autoloader, even if a step below fails
            trap '/opt/php81/bin/php artisan queue:restart || true' EXIT

            /opt/php81/bin/php -v
            /opt/php81/bin/php /usr/local/bin/composer install --no-dev --optimize-autoloader --ignore-platform-req=ext-http --ignore-platform-req=ext-dom
            /opt/php81/bin/php artisan migrate --force
            /opt/php81/bin/php artisan config:cache
            /opt/php81/bin/php artisan view:cache
            /opt/php81/bin/php artisan event:cache
            /opt/php81/bin/php artisan telegram:delete-webhook
            /opt/php81/bin/php artisan telegram:set-webhook

            # keep logs on failure, they are what explains it
            truncate -s 0 storage/logs/laravel.log || true
            truncate -s 0 storage/logs/queue.log || true

      - name: restart queue workers after vendor update
        if: ${{ !cancelled() }}
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: root
          password: ${{ secrets.ROOT_PASSWORD }}
          port: 22
          script: |
            supervisorctl restart 'water-ge-queue:*'
